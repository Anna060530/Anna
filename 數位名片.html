<style>

.foil span{font-size:30px;font-weight:700;line-height:1.2;background:linear-gradient(120deg,#8a6a2a,#f2dc9b 45%,#a8832f);-webkit-background-clip:text;background-clip:text;color:transparent}
.foil img{max-height:72px;max-width:60%;object-fit:contain}
.bc small{position:absolute;bottom:14px;color:rgba(255,255,255,.6)}
.pf6{display:flex;gap:14px;align-items:center}.t6 .av{width:84px;height:84px;margin:0;border:0;border-radius:24px;flex:none}
.n6{font-size:26px;margin:0;font-weight:700}.s6{color:var(--ac);font-weight:700}
.wh{background:#fff;border-radius:16px;padding:14px}
.rows a,.tiles a{box-shadow:0 1px 2px rgba(0,0,0,.05)}.rows a:active,.tiles a:active{transform:scale(.98)}

#qa{display:contents}

.cr small,.more,.ac,.n3,.t3 .hd,.s6,.lg,.av{color:var(--act,var(--ac))}
#card{color:var(--ink)}
.sheet1,.sheet2,.in3,.t5{background:var(--paper)}

.bio{color:var(--ink)}.t4 .bio{color:rgba(255,255,255,.9)}
.hd:before{background:var(--ink)}.t4 .hd:before{background:#fff}
.t4 .rows a{color:var(--ink)}
.lgs{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none}
.b3{height:130px;margin:-22px -22px 0;background:var(--hero) 50% var(--fy,50%)/cover;border-radius:4px 4px 0 0}

</style>

<body>

<script>

let S,tab=0,more=false;try{S=Object.assign(DEF(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=DEF()}

 const ac=AC(),c=$('#card'),T=S.tpl;

 const hi=(T==='t1'||T==='t4')?img:S.bg;c.style.setProperty('--hero',hi?`url(${hi})`:g);
 c.className=T;ord();c.style.setProperty('--act',dk(AC()));{const ln=S.links.find(l=>l.type==='line'&&l.url);$('#qa').innerHTML=(S.phone?`<a class="qb" href="tel:${esc(S.phone)}" aria-label="撥打電話">📞</a>`:'')+(ln?`<a class="qb" href="${esc(href(ln))}" target="_blank" rel="noopener" aria-label="LINE">💬</a>`:'')}c.style.setProperty('--fy',S.fy+'%');c.style.setProperty('--ay',S.ay+'%');$('#tbn').textContent=S.name;$('#tba').innerHTML=S.avatar?`<img src="${S.avatar}" alt="">`:esc((S.name||'?')[0]);
 const ct=`<div class="ct" data-s="ct">${S.phone?`<a href="tel:${esc(S.phone)}">${svg(IC.ph)}${esc(S.phone)}</a>`:''}${S.email?`<a href="mailto:${esc(S.email)}">${svg(IC.ml)}${esc(S.email)}</a>`:''}${S.addr?`<span>${svg(IC.pn)}${esc(S.addr)}</span>`:''}</div>`;
 const hasCt=S.phone||S.email||S.addr;
 const bio=S.bio?`<div data-s="bio"><p class="bio ${T==='t1'&&!more?'cl':''}">${esc(S.bio)}</p>${T==='t1'&&S.bio.length>60?`<button class="more" id="mr">${more?'收合':'更多'}</button>`:''}</div>`:'';
 const ex=S.extras.map((e,i)=>`<div data-s="x${i}"><h3 class="hd">${esc(e.title)}</h3><div class="box">${esc(e.body)}</div></div>`).join('');
 const lk=!S.links.length?'':T==='t2'?`<div data-s="links"><h3 class="hd">社群媒體</h3><div class="tiles">${S.links.map(l=>`<a href="${esc(href(l))}" target="_blank" rel="noopener"><i>${ico(l)}</i>${esc(l.label||TYPES[l.type][0])}</a>`).join('')}</div></div>`:`<div class="rows" data-s="links">${S.links.map(l=>`<a href="${esc(href(l))}" target="_blank" rel="noopener"><i>${ico(l)}</i><b>${esc(l.label||TYPES[l.type][0])}</b><s>›</s></a>`).join('')}</div>`;
 const lg=S.logo?`<img class="lg" src="${S.logo}" alt="">`:`<div class="lg">${esc((S.company||'?')[0])}</div>`;
 const av=S.avatar?`<img class="av" src="${S.avatar}" alt="">`:`<div class="av">${esc((S.name||'?')[0])}</div>`;
 const co=S.taxId?`<div class="co3" data-s="co">統一編號 ${esc(S.taxId)}</div>`:'';
 if(T>='t4'){c.innerHTML=extra(T,{ct,hasCt,bio,ex,lk,lg,av,co});return}
 c.innerHTML=T==='t1'?`<div class="hero"><div><h1 class="nm">${esc(S.name)}</h1><div class="tt">${esc(S.title)}</div></div></div><div class="sheet1"><div class="cr">${lg}<div><b>${esc(S.company)}</b><small>${esc(S.tag)}</small></div></div>${bio}${ex}${hasCt?ct:''}${lk}${co}</div>`
 :T==='t2'?`<div class="cover"></div><div class="sheet2">${av}<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><h1 class="n2">${esc(S.name)}</h1><div class="ac">${esc(S.title)}</div><div class="ac">${esc(S.company)}</div>${S.tag?`<div class="mt">${esc(S.tag)}</div>`:''}</div>${S.logo?`<img class="lgs" src="${S.logo}" alt="">`:''}</div>${hasCt?ct:''}${lk}${bio}${ex}${co}</div>`
 :`<div class="frame"><div class="in3">${S.bg?'<div class="b3"></div>':''}<div class="top3"><div><b>${esc(S.company)}</b><small>${esc(S.tag)}</small></div>${S.logo?`<img class="lg3" src="${S.logo}" alt="">`:`<div class="lg3">${esc((S.company||'?')[0])}</div>`}</div>${av.replace('class="av"','class="av" style="margin-top:0;border-color:#fff"')}<div><h1 class="n3">${esc(S.name)}</h1><b>${esc(S.title)}</b></div><div class="dash"></div>${hasCt?ct+'<div class="dash"></div>':''}${lk}${S.bio?`<div data-s="bio"><h3 class="hd">關於我</h3><div class="box">${esc(S.bio)}</div></div>`:''}${ex}${co}</div></div>`}
const AC=()=>S.cu.ac||COL[S.col][1];
function pal(){const d=S.mode==='dark'||S.tpl==='t4',b=d?{pg:'#0e1114',pp:'#1a1d22',sf:'#262a31',ik:'#f2f2f4',mu:'#a3a8b0'}:{pg:'#ececee',pp:S.tpl==='t5'?'#fbfbfa':'#f4f4f5',sf:'#ffffff',ik:'#1c1c1e',mu:'#6e6e73'};return{pg:S.cu.pg||b.pg,pp:S.cu.pp||b.pp,sf:b.sf,ik:S.cu.ik||b.ik,mu:b.mu}}
function dk(h){const n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;if((r*299+g*587+b*114)/1000<120)return h;return'#'+[r,g,b].map(v=>Math.round(v*.62).toString(16).padStart(2,'0')).join('')}
function ico(l){return l.icon?`<img class="ic" src="${l.icon}" alt="">`:TYPES[l.type][1]}
function setP(p,v){const ks=p.split('.');let o=S;ks.slice(0,-1).forEach(k=>o=o[k]);o[ks.at(-1)]=v}
function keys(){const base=['bio',...S.extras.map((_,i)=>'x'+i),'links','ct','co'];const o=(S.order||[]).filter(k=>base.includes(k));base.forEach(k=>{if(!o.includes(k))o.push(k)});S.order=o;return o}
function lab(k){return({bio:'個人介紹',links:'連結',ct:'聯絡資訊',co:'公司資訊'})[k]||(S.extras[+k.slice(1)]||{}).title||k}
function ord(){let st=document.getElementById('ordst');if(!st){st=document.createElement('style');st.id='ordst';document.head.appendChild(st)}st.textContent=keys().map((k,i)=>`#card [data-s="${k}"]{order:${i+1}${S.hide&&S.hide[k]?';display:none':''}}`).join('')}
function extra(T,o){
 const lks=S.links.length?o.lk:'';
 if(T==='t4'){const g=(h,b,k)=>`<div class="glass" data-s="${k}"><h3 class="hd">${h}</h3>${b}</div>`;
  return `<div class="g4"><div class="gtop">${o.av}<h1 class="n4">${esc(S.name)}</h1><div class="s4">${esc(S.title)}｜${esc(S.company)}</div></div>${S.bio?g('服務簡介',`<p class="bio">${esc(S.bio)}</p>`,'bio'):''}${S.extras.map((e,i)=>g(esc(e.title),`<div class="tx4">${esc(e.body)}</div>`,'x'+i)).join('')}${lks?g('社群媒體',lks,'links'):''}${o.hasCt?g('聯絡資訊',o.ct,'ct'):''}${g('公司資訊',`<div class="cc">${o.lg}<div><b>${esc(S.company)}</b><small>${esc(S.tag)}</small>${S.taxId?`<small>統一編號 ${esc(S.taxId)}</small>`:''}</div></div>`,'co')}</div>`}
 if(T==='t5')return `<div class="m5">${S.bg?'<div class="b5"></div>':''}<div>${o.av}<h1 class="n5">${esc(S.name)}</h1><div class="t5s"><b>${esc(S.title)}</b></div><div class="t5s">${esc(S.company)}${S.tag?`｜${esc(S.tag)}`:''}</div>${S.logo?`<img class="lgs" style="margin:12px auto 0;display:block" src="${S.logo}" alt="">`:''}</div><div class="dash c"></div>${S.bio?`<div data-s="bio"><p class="bio">${esc(S.bio)}</p></div>`:''}${o.hasCt?o.ct:''}${lks}${o.ex}${o.co}</div>`;
 return `<div class="m6"><div class="bc"${S.bg?` style="background:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.6)),url(${S.bg}) 50% ${S.fy}%/cover"`:''}><div class="foil">${S.logo?`<img src="${S.logo}" alt="">`:`<span>${esc(S.company)}</span>`}</div><small>${esc(S.tag)}</small></div><div class="pf6">${o.av}<div><h1 class="n6">${esc(S.name)}</h1><div class="s6">${esc(S.title)}</div></div></div>${o.bio}${o.hasCt?`<div class="wh" data-s="ct">${o.ct}</div>`:''}${lks}${o.ex}${o.co}</div>`}
$('#card').addEventListener('click',e=>{if(e.target.id==='mr'){more=!more;render()}});
$('#vc').onclick=async()=>{const v=`BEGIN:VCARD\nVERSION:3.0\nFN:${S.name}\nTITLE:${S.title}\nORG:${S.company}\nTEL:${S.phone}\nEMAIL:${S.email}\nEND:VCARD`;try{await navigator.clipboard.writeText(v);toast('已複製聯絡人資料')}catch(x){toast('無法複製，請手動記下資料')}};
const inp=(l,p,v,ty='text')=>`<label>${l}<input type="${ty}" data-p="${p}" value="${esc(v)}"></label>`;
const up=(l,k)=>`<label>${l}<input type="file" accept="image/*" data-img="${k}">${S[k]?`<span><button class="gb" data-rm="${k}">移除圖片</button></span>`:''}</label>`;
const mini={t1:'<rect x="3" y="2" width="30" height="40" rx="4" fill="#888"/><rect x="3" y="26" width="30" height="16" rx="4" fill="#ddd"/>',t2:'<rect x="3" y="2" width="30" height="14" rx="3" fill="#888"/><rect x="3" y="14" width="30" height="28" rx="5" fill="#ddd"/><circle cx="12" cy="16" r="6" fill="#aaa" stroke="#fff" stroke-width="2"/>',t3:'<rect x="3" y="2" width="30" height="40" rx="3" fill="#9b8274"/><rect x="7" y="6" width="22" height="32" fill="#f4f4f4"/>',t4:'<rect x="3" y="2" width="30" height="40" rx="4" fill="#223"/><circle cx="18" cy="10" r="5" fill="#99a"/><rect x="7" y="18" width="22" height="8" rx="3" fill="#667"/><rect x="7" y="29" width="22" height="8" rx="3" fill="#667"/>',t5:'<rect x="3" y="2" width="30" height="40" rx="4" fill="#f2f2f0" stroke="#aaa"/><circle cx="18" cy="12" r="6" fill="#aaa"/><rect x="9" y="24" width="18" height="3" rx="1.5" fill="#999"/><rect x="9" y="31" width="18" height="5" rx="2.5" fill="none" stroke="#999"/>',t6:'<rect x="3" y="2" width="30" height="40" rx="4" fill="#ddd"/><rect x="6" y="5" width="24" height="14" rx="3" fill="#2a2d3a"/><rect x="11" y="10" width="14" height="3" rx="1.5" fill="#d9b86a"/><rect x="6" y="24" width="24" height="4" rx="2" fill="#aaa"/>'};
function form(){
 $('#seg').innerHTML=['資料','連結與內容','版型'].map((x,i)=>`<button data-tab="${i}" class="${tab===i?'on':''}">${x}</button>`).join('');
 const o=(d,v,x)=>`<option value="${v}"${d===v?' selected':''}>${x}</option>`;
 $('#form').innerHTML=tab===0?`${inp('姓名','name',S.name)}${inp('職稱','title',S.title)}<label>個人介紹<textarea data-p="bio">${esc(S.bio)}</textarea></label><div class="row">${inp('電話','phone',S.phone)}${inp('Email','email',S.email)}</div>${inp('地址／城市','addr',S.addr)}<div class="row">${inp('公司名稱','company',S.company)}${inp('公司一句話','tag',S.tag)}</div>${inp('統一編號','taxId',S.taxId)}${inp('網站網址（頂部「前往網站」）','site',S.site,'url')}${up('頭像／主視覺照片','avatar')}${S.avatar?`<label>頭像上下位置<input type="range" data-p="ay" min="0" max="100" value="${S.ay}"></label>`:''}${up('Logo','logo')}${up('封面或背景圖（選填）','bg')}${S.bg||S.avatar?`<label>封面圖上下位置<input type="range" data-p="fy" min="0" max="100" value="${S.fy}"></label>`:''}`:
 tab===1?`<h4>連結按鈕</h4>${S.links.map((l,i)=>`<div class="item"><div class="row"><label>類型<select data-p="links.${i}.type">${Object.entries(TYPES).map(([k,v])=>o(l.type,k,v[0])).join('')}</select></label>${inp('名稱',`links.${i}.label`,l.label)}</div>${inp('網址或號碼',`links.${i}.url`,l.url)}<label>自訂圖示（選填，可換成自己的圖）<input type="file" accept="image/*" data-img="links.${i}.icon">${l.icon?`<span><button class="gb" data-rm="links.${i}.icon">移除，改回預設圖示</button></span>`:''}</label><button class="gb" data-lm="${i},-1" aria-label="上移">↑ 上移</button> <button class="gb" data-lm="${i},1" aria-label="下移">↓ 下移</button> <button class="gb" data-dl="links,${i}">刪除</button></div>`).join('')}<button class="gb" data-add="links">＋ 新增連結</button><h4 style="margin-top:22px">文字區塊（服務項目、證照、經歷）</h4>${S.extras.map((e,i)=>`<div class="item">${inp('標題',`extras.${i}.title`,e.title)}<label>內容<textarea data-p="extras.${i}.body">${esc(e.body)}</textarea></label><button class="gb" data-dl="extras,${i}">刪除</button></div>`).join('')}<button class="gb" data-add="extras">＋ 新增區塊</button>`:
 `<h4>版型</h4><div class="tp">${Object.entries(TPL).map(([k,v])=>`<button data-tpl="${k}" class="${S.tpl===k?'on':''}"><svg width="36" height="44" viewBox="0 0 36 44">${mini[k].replace(/#888|#9b8274|#2a2d3a/g,AC())}</svg>${v}</button>`).join('')}</div><h4>主色</h4><div class="sw">${Object.entries(COL).map(([k,v])=>`<button data-col="${k}" aria-label="${v[0]}" class="${S.col===k?'on':''}" style="background:${v[1]}"></button>`).join('')}</div><h4>明暗</h4><div style="margin-bottom:14px"><button class="gb ${S.mode!=='dark'?'on':''}" data-mode="light">淺色</button> <button class="gb ${S.mode==='dark'?'on':''}" data-mode="dark">深色</button></div>
<h4>自訂配色（選填）</h4><div class="row">${[['ac','主色',AC()],['pg','頁面背景',pal().pg],['pp','卡片底色',pal().pp],['ik','文字色',pal().ik]].map(([k,l,v])=>`<label>${l}<input type="color" data-p="cu.${k}" value="${v}"></label>`).join('')}</div><button class="gb" data-cr="1">還原預設配色</button>
<h4 style="margin-top:20px">區塊順序（可上下移動、隱藏）</h4>${keys().map((k,i)=>`<div class="sec"><b>${esc(lab(k))}</b><button class="gb" data-mv="${i},-1" aria-label="上移">↑</button><button class="gb" data-mv="${i},1" aria-label="下移">↓</button><button class="gb ${S.hide&&S.hide[k]?'':'on'}" data-hd="${k}">${S.hide&&S.hide[k]?'隱藏':'顯示'}</button></div>`).join('')}<h4 style="margin-top:20px">分享</h4>${inp('名片網址（QR Code 與分享用）','url',S.url,'url')}<p style="color:var(--mu);font-size:13px">儲存空間約已使用 ${Math.min(99,Math.round(JSON.stringify(S).length/50000))}%（圖片越多越滿）</p><p style="margin-top:28px"><button class="gb" id="rs">重設為範例</button></p>`}
document.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.p){const ks=el.dataset.p.split('.');let o=S;ks.slice(0,-1).forEach(k=>o=o[k]);o[ks.at(-1)]=el.value;save();render()}
 if(el.dataset.img&&el.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const mx=/icon$/.test(el.dataset.img)?128:el.dataset.img==='logo'?240:el.dataset.img==='avatar'?640:900,m=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*m;c.height=im.height*m;c.getContext('2d').drawImage(im,0,0,c.width,c.height);setP(el.dataset.img,c.toDataURL(/icon$/.test(el.dataset.img)?'image/png':'image/jpeg',.72));save();form();render()};im.src=r.result};r.readAsDataURL(el.files[0])}});
$('#sheet').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.tab!==undefined){tab=+d.tab;form();return}
 if(d.rm)setP(d.rm,'');else if(d.tpl)S.tpl=d.tpl;else if(d.col){S.col=d.col;delete S.cu.ac}
 else if(d.mode)S.mode=d.mode;
 else if(d.cr){S.cu={}}
 else if(d.lm){const[i,s]=d.lm.split(',').map(Number),j=i+s;if(j<0||j>=S.links.length)return;[S.links[i],S.links[j]]=[S.links[j],S.links[i]]}
 else if(d.mv){const[i,s]=d.mv.split(',').map(Number),o=keys(),j=i+s;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];S.order=o}
 else if(d.hd){S.hide=S.hide||{};S.hide[d.hd]=!S.hide[d.hd]}
 else if(d.dl){const[k,i]=d.dl.split(',');S[k].splice(+i,1)}
 else if(d.add)S[d.add].push(d.add==='links'?{type:'other',label:'新連結',url:''}:{title:'新標題',body:''});
 else if(b.id==='rs'){if(!confirm('要清除目前內容並重設嗎？'))return;S=DEF()}
 else return;
 save();form();render()});
const curUrl=()=>(S.url||'').trim()||location.href;
const siteUrl=()=>{const s=(S.site||'').trim()||((S.links.find(l=>l.type==='site')||{}).url||'').trim();return s?(/^https?:/.test(s)?s:'https://'+s):''};
function openMenu(v){$('#menu').hidden=!v;$('#mbk').hidden=!v;$('#tbm').setAttribute('aria-expanded',v)}
$('#tbm').onclick=()=>openMenu($('#menu').hidden);
$('#mbk').onclick=()=>openMenu(false);
$('#tbs').onclick=()=>{const u=siteUrl();if(!u){toast('請先在「資料」填入網站網址');return}window.open(u,'_blank','noopener')};
const showModal=h=>{$('#mbody').innerHTML=h;$('#modal').hidden=false};
$('#mx').onclick=()=>{$('#modal').hidden=true};
async function share(){const u=curUrl();try{if(navigator.share){await navigator.share({title:S.name,text:S.name+' 的數位名片',url:u});return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(u);toast('已複製名片連結')}catch(e){toast('請手動複製網址')}}
$('#fab').onclick=share;
$('#menu').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;openMenu(false);const a=b.dataset.m;
 if(a==='qr'){showModal('<div id="qrb"></div><p>用手機相機掃描，即可開啟這張名片。長按 QR Code 可儲存圖片。</p>');try{const t=document.createElement('div');new QRCode(t,{text:curUrl(),width:240,height:240});setTimeout(()=>{const cv=t.querySelector('canvas'),im=new Image();im.src=cv?cv.toDataURL():t.querySelector('img').src;im.alt='QR Code';$('#qrb').appendChild(im)},60)}catch(x){$('#qrb').textContent='QR Code 載入失敗'}}
 else if(a==='img'){toast('產生中…');try{const cv=await html2canvas($('#card'),{scale:2,useCORS:true,backgroundColor:null});showModal(`<img class="full" src="${cv.toDataURL('image/png')}" alt="名片圖片"><p>長按圖片，選擇「儲存到照片」。</p>`)}catch(x){toast('無法產生圖片')}}
 else if(a==='share')share();else if(a==='vc')$('#vc').click();else if(a==='ed'){form();$('#sheet').classList.add('open');document.body.classList.add('ed')}});
$('#done').onclick=()=>{$('#sheet').classList.remove('open');document.body.classList.remove('ed');toast('已儲存')};
render();
</script>
</body>
